<!doctype html>
<html lang="zh-CN" data-theme="minimalist-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SE 算法参数 · 状态估计 SE · PAS</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/se-dashboard.css">
  <link rel="icon" href="data:,">
</head>
<body data-page="/se-params" data-se-view="params" class="se-main-body">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">P</span>
        <div>
          <strong>PAS</strong>
          <small data-i18n="brand.sub">在线分析平台</small>
        </div>
      </div>
      <nav>
        <a href="/overview.html" data-route="overview" data-i18n="nav.overview">总览</a>
        <div class="nav-group">
          <span data-i18n="nav.analysis">分析功能</span>
          <a href="/se-main.html" data-route="se-root" class="nav-parent-active" data-i18n="nav.se_root">状态估计 SE</a>
          <div class="nav-sub">
            <a href="/se-main.html" data-route="se-main" data-i18n="nav.se_main">主画面</a>
            <a href="/se-flow.html" data-route="se-flow" data-i18n="nav.se_flow">潮流图</a>
            <a href="/se-curves.html" data-route="se-curves" data-i18n="nav.se_curves">历史曲线</a>
            <a href="/se-measurements.html" data-route="se-measurements" data-i18n="nav.se_measurements">全量测分析</a>
            <a href="/se-params.html" data-route="se-params" class="active" data-i18n="nav.se_params">算法参数</a>
            <a href="/se-prefilter.html" data-route="se-prefilter" data-i18n="nav.se_prefilter">预过滤量测</a>
            <a href="/se-pseudo.html" data-route="se-pseudo" data-i18n="nav.se_pseudo">伪量测</a>
            <a href="/se-bad.html" data-route="se-bad" data-i18n="nav.se_bad">坏量测</a>
            <a href="/se-logs.html" data-route="se-logs" data-i18n="nav.se_logs">运行日志</a>
          </div>
          <a href="/lf-main.html" data-route="lf" data-i18n="nav.lf">潮流分析 LF</a>
          <a href="/ca-main.html" data-route="ca" data-i18n="nav.ca">静态安全 CA</a>
        </div>
        <div class="nav-group">
          <span data-i18n="nav.management">运行管理</span>
          <a href="/runs.html" data-route="runs" data-i18n="nav.runs">运行历史</a>
          <a href="/measurements.html" data-route="measurements" data-i18n="nav.measurements">设备量测</a>
          <a href="/limits.html" data-route="limits" data-i18n="nav.limits">安全限值</a>
          <a href="/workspace.html" data-route="workspace" data-i18n="nav.workspace">工作目录</a>
          <a href="/settings.html" data-route="settings" data-i18n="nav.settings">系统设置</a>
        </div>
      </nav>
      <div class="sidebar-foot">
        <span class="status-dot" id="service-dot"></span>
        <span id="service-state" data-i18n="service.checking">服务检查中</span>
      </div>
    </aside>

    <main class="main se-main">
      <header class="se-topbar">
        <div class="se-title-group">
          <div class="se-title-row">
            <h1 data-i18n="title.params">SE 算法参数</h1>
            <span id="params-updated-at" class="se-run-meta tabular">—</span>
          </div>
        </div>
        <div class="se-top-actions">
          <button type="button" class="se-btn danger-ghost" id="btn-params-reset" data-i18n="params.reset">恢复默认</button>
          <button type="button" class="se-btn ghost" id="btn-params-save" data-i18n="params.save">保存参数</button>
          <button type="button" class="se-btn primary" id="btn-params-trial" data-i18n="params.trial">保存并试算对比</button>
          <button type="button" class="se-btn ghost" id="btn-refresh" data-i18n="action.refresh">刷新</button>
          <select id="theme-select" class="se-select compact" aria-label="Theme">
            <option value="minimalist-light" data-i18n="theme.light">极简明亮</option>
            <option value="precision-dark" data-i18n="theme.dark">精密暗黑</option>
            <option value="bento-grid" data-i18n="theme.bento">便当盒网格</option>
            <option value="glassmorphism" data-i18n="theme.glass">毛玻璃拟态</option>
            <option value="editorial" data-i18n="theme.editorial">编辑杂志</option>
            <option value="sci-fi-cyan" data-i18n="theme.cyan">科幻 · 电光青</option>
            <option value="sci-fi-purple" data-i18n="theme.purple">科幻 · 赛博紫</option>
            <option value="sci-fi-matrix" data-i18n="theme.matrix">科幻 · 矩阵绿</option>
          </select>
          <select id="lang-select" class="se-select compact" aria-label="Language">
            <option value="zh-CN">中文</option>
            <option value="en-US">English</option>
            <option value="ru-RU">Русский</option>
          </select>
        </div>
      </header>

      <div id="notice" class="notice" role="status" hidden></div>
      <div id="params-trial-bar" class="se-trial-bar" hidden></div>

      <div class="se-workspace" id="se-workspace">
        <section class="se-panel active" data-panel="params">
          <div class="se-card se-full-card">
            <div class="se-toolbar">
              <div class="se-tool-group" id="params-subtab-seg" role="tablist">
                <button type="button" class="se-chip-btn seg active" data-psub="para" data-i18n="params.tab_para">算法参数</button>
                <button type="button" class="se-chip-btn seg" data-psub="weights" data-i18n="params.tab_weights">量测权重</button>
              </div>
              <div class="se-tool-group" id="weights-toolbar-right" hidden>
                <select id="wt-type-filter" class="se-select compact" aria-label="Device type"></select>
                <input id="wt-search-input" class="se-input compact" type="search" data-i18n-placeholder="ph.search_wt" placeholder="搜索权重规则">
                <button type="button" class="se-btn primary mini" id="btn-add-weight" data-i18n="wt.add">+ 新增权重</button>
              </div>
            </div>
            <form id="se-params-form" class="se-params-form"></form>
            <div class="se-table-scroll" id="weights-table-wrap" hidden></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- 量测权重编辑弹窗 -->
  <dialog id="weight-dialog" class="se-modal wide" aria-labelledby="wt-dlg-title">
    <h3 id="wt-dlg-title" data-i18n="wt.dlg_title">量测权重规则</h3>
    <form id="weight-form" class="se-form-grid" style="margin-top:8px">
      <input type="hidden" name="id" id="fw-id">
      <label class="se-field">
        <span data-i18n="wt.scope">作用范围</span>
        <select id="fw-scope">
          <option value="device_type" data-i18n="wt.scope_type">按设备类</option>
          <option value="device" data-i18n="wt.scope_dev">按单设备</option>
        </select>
      </label>
      <label class="se-field">
        <span data-i18n="wt.dev_type">设备类型</span>
        <select id="fw-dev-type"></select>
      </label>
      <label class="se-field" id="fw-dev-row" hidden>
        <span data-i18n="wt.dev_name">目标设备</span>
        <select id="fw-dev-name"></select>
      </label>
      <label class="se-field">
        <span data-i18n="wt.metric">指标</span>
        <select id="fw-metric"></select>
      </label>
      <label class="se-field">
        <span data-i18n="qa.weight">权重</span>
        <input id="fw-weight" class="tabular" type="number" step="any" min="1e-9" max="1e9" value="1" required>
      </label>
      <label class="se-field">
        <span data-i18n="wt.status">状态</span>
        <select id="fw-enabled">
          <option value="1" data-i18n="bool.on">开启</option>
          <option value="0" data-i18n="bool.off">关闭</option>
        </select>
      </label>
      <label class="se-field full">
        <span data-i18n="qa.note">备注</span>
        <input id="fw-note" type="text" maxlength="200">
      </label>
      <div class="se-modal-actions full">
        <button type="button" class="se-btn ghost" id="btn-wt-cancel" data-i18n="action.cancel">取消</button>
        <button type="submit" class="se-btn primary" data-i18n="qa.submit">保存并生效</button>
      </div>
    </form>
  </dialog>

  <!-- 高危操作模态确认框（重置 SE 算法参数） -->
  <dialog id="confirm-dialog" class="se-modal" aria-labelledby="confirm-title">
    <h3 id="confirm-title" data-i18n="modal.reset_title">重置 pas_se_para</h3>
    <p id="confirm-desc" class="se-modal-desc" data-i18n="modal.reset_desc">恢复 se.para 默认值？</p>
    <div class="se-modal-actions">
      <button type="button" class="se-btn ghost" id="btn-confirm-cancel" autofocus data-i18n="action.cancel">取消</button>
      <button type="button" class="se-btn danger" id="btn-confirm-ok" data-i18n="action.confirm_reset">确认恢复</button>
    </div>
  </dialog>

  <script src="/assets/se-dashboard.js"></script>
</body>
</html>
