<!doctype html>
<html lang="zh-CN" data-theme="ethereal-aurora">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>态势推演 · EW · PAS</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/se-dashboard.css">
  <link rel="icon" href="data:,">
  <script src="/assets/theme-registry.js"></script>
  <script src="/assets/pas-kit.js"></script>
  <script src="/assets/se-common.js"></script>
</head>
<body data-page="/ew-scenario" data-ew-view="scenario" data-wall-ready="1" class="se-main-body">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">P</span><div><strong>PAS</strong><small data-i18n="brand.sub">在线分析平台</small></div></div>
      <nav>
        <a href="/overview.html" data-route="overview" data-i18n="nav.overview">总览</a>
        <div class="nav-group">
          <span data-i18n="nav.analysis">分析功能</span>
          <a href="/se-main.html" data-route="se-root" data-i18n="nav.se_root">状态估计 SE</a>
          <a href="/lf-main.html" data-route="lf-root" data-i18n="nav.lf">潮流分析 LF</a>
          <a href="/ca-main.html" data-route="ca-root" data-i18n="nav.ca">静态安全 CA</a>
          <a href="/ew-main.html" data-route="ew-root" class="nav-parent-active" data-i18n="nav.ew">安全预警 EW</a>
          <div class="nav-sub">
            <a href="/ew-main.html" data-route="ew-main" data-i18n="nav.ew_main">主画面</a>
            <a href="/ew-scenario.html" data-route="ew-scenario" class="active" data-i18n="nav.ew_scenario">态势推演</a>
            <a href="/ew-risks.html" data-route="ew-risks" data-i18n="nav.ew_risks">风险预警</a>
            <a href="/ew-green.html" data-route="ew-green" data-i18n="nav.ew_green">绿电维生</a>
            <a href="/ew-logs.html" data-route="ew-logs" data-i18n="nav.ew_logs">运行日志</a>
          </div>
        </div>
        <div class="nav-group">
          <span data-i18n="nav.management">运行管理</span>
          <a href="/runs.html" data-route="runs" data-i18n="nav.runs">运行历史</a>
          <a href="/settings.html" data-route="settings" data-i18n="nav.settings">系统设置</a>
        </div>
      </nav>
      <div class="sidebar-foot"><span class="status-dot" id="service-dot"></span><span id="service-state" data-i18n="service.checking">服务检查中</span></div>
    </aside>

    <main class="main se-main">
      <header class="se-topbar">
        <div class="se-title-group">
          <div class="se-title-row">
            <h1 data-i18n="title.ew_scenario">态势推演</h1>
            <span id="ew-sc-level-pill" class="se-pill neutral">—</span>
            <span id="ew-sc-meta" class="se-run-meta tabular">—</span>
          </div>
        </div>
        <div class="se-top-actions">
          <select id="ew-sc-scenario" class="se-select compact" aria-label="Forecast Scenario"></select>
          <button type="button" class="se-btn primary" id="btn-ew-sc-run" data-i18n="action.run_ew">执行 EW</button>
          <button type="button" class="se-btn ghost" id="btn-ew-sc-config" data-i18n="ew.btn_params">预测与覆写</button>
          <button type="button" class="se-btn ghost" id="btn-refresh" data-i18n="action.refresh">刷新</button>
          <select id="theme-select" class="se-select compact" aria-label="Theme"></select>
          <select id="lang-select" class="se-select compact" aria-label="Language">
            <option value="zh-CN">中文</option><option value="en-US">EN</option><option value="ru-RU">RU</option>
          </select>
        </div>
      </header>

      <div id="notice" class="notice" role="status" hidden></div>

      <div class="se-workspace">
        <div class="ew-sim-shell">
          <!-- 上区（核心）：实时演化潮流系统图 + 右侧当前时刻断面与设备监视 -->
          <div class="ew-sim-top">
            <section class="se-topo-stage-card ew-sim-stage">
              <div class="se-toolbar ew-sim-bar">
                <div class="se-tool-group" style="gap:4px">
                  <button type="button" class="se-btn mini" id="btn-sim-prev" title="上一时刻 (-15min)">⏮</button>
                  <button type="button" class="se-btn mini primary" id="btn-sim-play" title="自动播放/暂停演化">▶ 推演</button>
                  <button type="button" class="se-btn mini" id="btn-sim-next" title="下一时刻 (+15min)">⏭</button>
                  <select id="ew-sim-speed" class="se-select compact" aria-label="Speed" style="width:62px">
                    <option value="900">1x</option>
                    <option value="450" selected>2x</option>
                    <option value="200">4x</option>
                  </select>
                  <span id="ew-sim-clock" class="se-pill accent tabular">—</span>
                </div>
                <div class="ew-sim-slider-wrap">
                  <input id="ew-sim-slider" type="range" min="0" max="95" value="0" step="1" aria-label="96-point timeline">
                </div>
                <div class="se-tool-group" style="gap:4px">
                  <select id="ew-svg-mode" class="se-select compact" aria-label="Map Mode">
                    <option value="power">预测潮流 (kW)</option>
                    <option value="loading">N-1 负载率 (%)</option>
                    <option value="voltage">母线电压 (pu)</option>
                  </select>
                  <select id="ew-svg-jump" class="se-select compact" aria-label="Locate Device" style="max-width:136px"></select>
                  <button type="button" class="se-btn mini" id="btn-ew-zoom-in">+</button>
                  <span class="se-zoom-text tabular" id="ew-zoom-label">100%</span>
                  <button type="button" class="se-btn mini" id="btn-ew-zoom-out">−</button>
                  <button type="button" class="se-btn mini" id="btn-ew-zoom-fit">适应</button>
                </div>
              </div>

              <div class="se-svg-viewport ew-svg-viewport" id="ew-svg-viewport">
                <div class="se-svg-canvas" id="ew-svg-canvas"></div>
                <div class="ew-sim-hud" id="ew-sim-hud"></div>
              </div>
            </section>

            <aside class="ew-sim-side">
              <section class="se-side-card">
                <div class="se-side-head">
                  <h2 data-i18n="ew.sim_snapshot">当刻演化断面</h2>
                  <span id="ew-sim-slot-pill" class="se-pill ok tabular">—</span>
                </div>
                <div class="ew-sim-kv" id="ew-sim-kv"></div>
              </section>

              <section class="se-side-card ew-sim-alerts-card">
                <div class="se-side-head">
                  <h2 data-i18n="ew.sim_risks">当刻潜在风险</h2>
                  <span id="ew-sim-risk-cnt" class="se-pill ok tabular">0</span>
                </div>
                <div class="se-bad-list" id="ew-sim-risk-list"></div>
              </section>

              <section class="se-side-card ew-sim-dev-card">
                <div class="se-side-head">
                  <h2 id="ew-sim-dev-title" data-i18n="ew.sim_device">设备演化态</h2>
                  <span id="ew-sim-dev-type" class="se-tag">—</span>
                </div>
                <div class="se-inspector-body" id="ew-sim-dev-body"></div>
              </section>
            </aside>
          </div>

          <!-- 下区：未来 96 点预测演化曲线（同步垂直游标，点击/拖动直接驱动系统图） -->
          <section class="se-home-panel accent-stat ew-sim-curve-panel">
            <div class="se-home-panel-head">
              <div class="se-tool-group" style="gap:8px">
                <h2 data-i18n="ew.sim_curve_title">未来 24h 96 点趋势演化曲线</h2>
                <span id="ew-sim-ds-badges" class="se-tool-group" style="gap:4px"></span>
              </div>
              <div class="se-tool-group" style="gap:4px">
                <button type="button" class="se-chip-btn seg active" data-ew-sim-chart="green">风光荷 / SOC</button>
                <button type="button" class="se-chip-btn seg" data-ew-sim-chart="weather">气象预测</button>
                <button type="button" class="se-chip-btn seg" data-ew-sim-chart="loading">N-0/N-1负载</button>
                <button type="button" class="se-chip-btn seg" data-ew-sim-chart="score">母线电压/评分</button>
              </div>
            </div>
            <div class="se-home-panel-body ew-sim-curve-body" id="ew-sim-curve"></div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <!-- 预测数据源、扫描参数与单点手工覆写配置弹窗 -->
  <dialog id="ew-cfg-dialog" class="se-modal ew-cfg-dialog" aria-labelledby="ew-cfg-dlg-title">
    <div class="se-toolbar" style="margin-bottom:8px">
      <h3 id="ew-cfg-dlg-title" style="margin:0;font-size:14px">预测数据源、参数与单点覆写</h3>
      <div class="se-tool-group" style="margin-left:auto;gap:6px">
        <div id="ew-ds-badges" class="se-tool-group" style="gap:4px"></div>
        <button type="button" class="se-btn mini primary" id="btn-ew-save-run">保存并重算</button>
        <button type="button" class="se-btn mini ghost" id="btn-ew-reset-params">恢复默认</button>
        <button type="button" class="se-btn mini ghost" id="btn-ew-cfg-close">✕</button>
      </div>
    </div>
    <form id="ew-params-form" class="se-params-form" style="grid-template-columns:repeat(6,minmax(0,1fr));margin-bottom:10px">
      <label class="se-field"><span>预测演变剧本</span><select id="p-scenario" name="forecast_scenario"></select></label>
      <label class="se-field"><span>未来点数</span><input type="number" name="horizon_points" min="4" max="96" step="1"></label>
      <label class="se-field"><span>N-1 设备上限</span><input type="number" name="max_n1_devices" min="1" max="60" step="1"></label>
      <label class="se-field"><span>储能SOC下限</span><input type="number" name="storage_min_soc" min="0.02" max="0.6" step="0.01"></label>
      <label class="se-field"><span>储能SOC上限</span><input type="number" name="storage_max_soc" min="0.5" max="1.0" step="0.01"></label>
      <label class="se-field"><span>充放效率</span><input type="number" name="storage_eff" min="0.5" max="1.0" step="0.01"></label>
      <label class="se-field"><span>电压下限(pu)</span><input type="number" name="v_min_pu" min="0.5" max="1.05" step="0.01"></label>
      <label class="se-field"><span>电压上限(pu)</span><input type="number" name="v_max_pu" min="0.95" max="1.5" step="0.01"></label>
      <label class="se-field"><span>重载预警(%)</span><input type="number" name="overload_warn_pct" min="10" max="200" step="1"></label>
      <label class="se-field"><span>过载限值(%)</span><input type="number" name="overload_limit_pct" min="20" max="300" step="1"></label>
      <label class="se-field"><span>N-1 扫描</span><select name="scan_n1"><option value="1">启用</option><option value="0">停用</option></select></label>
      <label class="se-field"><span>气象扰动</span><select name="scan_weather"><option value="1">启用</option><option value="0">停用</option></select></label>
      <label class="se-field" style="grid-column:span 2"><span>新能源预测库 (renewgen.db)</span><input type="text" name="renewgen_db_path"></label>
      <label class="se-field" style="grid-column:span 2"><span>负荷预测库 (load.db)</span><input type="text" name="load_db_path"></label>
      <label class="se-field" style="grid-column:span 2"><span>气象预测库 (weather.db)</span><input type="text" name="weather_db_path"></label>
    </form>

    <div class="se-toolbar" style="margin-bottom:6px">
      <strong style="font-size:12.5px">单时段手工覆写（情景演练）</strong>
      <form id="ew-ovr-form" class="se-tool-group" style="margin-left:auto;gap:4px;flex-wrap:wrap">
        <input id="ovr-slot" class="se-input compact tabular" type="number" min="0" max="95" placeholder="时段 0-95" style="width:76px" required>
        <input id="ovr-irr" class="se-input compact tabular" type="number" min="0" max="1400" step="any" placeholder="辐照" style="width:66px">
        <input id="ovr-wind" class="se-input compact tabular" type="number" min="0" max="65" step="any" placeholder="风速" style="width:64px">
        <input id="ovr-temp" class="se-input compact tabular" type="number" min="-85" max="30" step="any" placeholder="气温" style="width:64px">
        <input id="ovr-wkw" class="se-input compact tabular" type="number" min="0" step="any" placeholder="风电kW" style="width:70px">
        <input id="ovr-pkw" class="se-input compact tabular" type="number" min="0" step="any" placeholder="光伏kW" style="width:70px">
        <input id="ovr-lkw" class="se-input compact tabular" type="number" min="0" step="any" placeholder="负荷kW" style="width:70px">
        <button type="submit" class="se-btn mini primary">写入</button>
        <button type="button" class="se-btn mini danger-ghost" id="btn-ew-ovr-clear">清空</button>
      </form>
    </div>
    <div class="se-table-scroll" style="max-height:180px">
      <table class="se-table compact">
        <thead>
          <tr><th>时段#</th><th>辐照</th><th>风速</th><th>气温</th><th>风电kW</th><th>光伏kW</th><th>负荷kW</th><th>更新时间</th><th>操作</th></tr>
        </thead>
        <tbody id="ew-ovr-tbody"></tbody>
      </table>
    </div>
  </dialog>

  <dialog id="confirm-dialog" class="se-modal" aria-labelledby="confirm-title">
    <h3 id="confirm-title"></h3>
    <p id="confirm-desc" style="margin:8px 0 14px;color:var(--text-secondary);font-size:13px"></p>
    <div class="se-modal-actions">
      <button type="button" class="se-btn ghost" id="btn-confirm-cancel" data-i18n="action.cancel">取消</button>
      <button type="button" class="se-btn danger" id="btn-confirm-ok" data-i18n="action.confirm">确认</button>
    </div>
  </dialog>

  <script src="/assets/ew-app.js"></script>
</body>
</html>
