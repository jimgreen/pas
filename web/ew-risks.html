<!doctype html>
<html lang="zh-CN" data-theme="ethereal-aurora">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>风险预警 · EW · PAS</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/se-dashboard.css">
  <link rel="icon" href="data:,">
  <script src="/assets/theme-registry.js"></script>
  <script src="/assets/pas-kit.js"></script>
  <script src="/assets/se-common.js"></script>
</head>
<body data-page="/ew-risks" data-ew-view="risks" class="se-main-body">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">P</span><div><strong>PAS</strong><small data-i18n="brand.sub">在线分析平台</small></div></div>
      <nav>
        <a href="/overview.html" data-route="overview" data-i18n="nav.overview">总览</a>
        <div class="nav-group">
          <span data-i18n="nav.analysis">分析功能</span>
          <a href="/se-main.html" data-route="se-root" data-i18n="nav.se_root">状态估计 SE</a>
          <a href="/lf-main.html" data-route="lf-root" data-i18n="nav.lf">潮流分析 LF</a>
          <a href="/ca-main.html" data-route="ca-root" data-i18n="nav.ca">静态安全 CA</a>
          <a href="/ew-main.html" data-route="ew-root" class="nav-parent-active" data-i18n="nav.ew">安全预警 EW</a>
          <div class="nav-sub">
            <a href="/ew-main.html" data-route="ew-main" data-i18n="nav.ew_main">主画面</a>
            <a href="/ew-scenario.html" data-route="ew-scenario" data-i18n="nav.ew_scenario">态势推演</a>
            <a href="/ew-risks.html" data-route="ew-risks" class="active" data-i18n="nav.ew_risks">风险预警</a>
            <a href="/ew-green.html" data-route="ew-green" data-i18n="nav.ew_green">绿电维生</a>
            <a href="/ew-logs.html" data-route="ew-logs" data-i18n="nav.ew_logs">运行日志</a>
          </div>
        </div>
        <div class="nav-group">
          <span data-i18n="nav.management">运行管理</span>
          <a href="/runs.html" data-route="runs" data-i18n="nav.runs">运行历史</a>
          <a href="/settings.html" data-route="settings" data-i18n="nav.settings">系统设置</a>
        </div>
      </nav>
      <div class="sidebar-foot"><span class="status-dot" id="service-dot"></span><span id="service-state" data-i18n="service.checking">服务检查中</span></div>
    </aside>

    <main class="main se-main">
      <header class="se-topbar">
        <div class="se-title-group">
          <div class="se-title-row">
            <h1 data-i18n="title.ew_risks">风险预警</h1>
            <span id="ew-risks-meta" class="se-run-meta tabular">—</span>
          </div>
        </div>
        <div class="se-top-actions">
          <button type="button" class="se-btn primary" id="btn-run-ew" data-i18n="action.run_ew">执行 EW</button>
          <button type="button" class="se-btn ghost" id="btn-export-risks" data-i18n="action.export_csv">导出 CSV</button>
          <button type="button" class="se-btn ghost" id="btn-refresh" data-i18n="action.refresh">刷新</button>
          <select id="theme-select" class="se-select compact" aria-label="Theme"></select>
          <select id="lang-select" class="se-select compact" aria-label="Language">
            <option value="zh-CN">中文</option><option value="en-US">EN</option><option value="ru-RU">RU</option>
          </select>
        </div>
      </header>

      <div id="notice" class="notice" role="status" hidden></div>

      <div class="se-workspace">
        <div class="pas-table-fill-card">
          <div class="se-toolbar" style="flex-wrap:wrap;gap:6px">
            <div class="se-tool-group" style="gap:4px">
              <button type="button" class="se-chip-btn seg active" data-ew-view-tab="risks" data-i18n="ew.tab_risk_list">潜在风险清单</button>
              <button type="button" class="se-chip-btn seg" data-ew-view-tab="points" data-i18n="ew.tab_96_points">未来 96 点全表</button>
            </div>
            <div class="se-tool-group" id="ew-risk-filters" style="margin-left:auto;gap:6px">
              <select id="ew-f-cat" class="se-select compact">
                <option value="all">全部类别</option>
                <option value="Green">绿电维生</option>
                <option value="N-1">N-1 故障</option>
                <option value="Weather">气象扰动</option>
                <option value="N-0">N-0 基态</option>
              </select>
              <select id="ew-f-sev" class="se-select compact">
                <option value="all">全部等级</option>
                <option value="critical">危急</option>
                <option value="high">高危</option>
                <option value="medium">中危</option>
                <option value="low">低危</option>
              </select>
              <input id="ew-f-q" class="se-input compact" type="search" placeholder="筛选时刻/设备/扰动…">
            </div>
          </div>

          <div id="ew-panel-risks" class="se-table-scroll" style="flex:1;min-height:0">
            <table class="se-table">
              <thead>
                <tr>
                  <th>时刻</th><th>等级</th><th>分类</th><th>扰动/事件</th><th>设备</th>
                  <th>预测值</th><th>限值</th><th>越限%</th><th>详情与调度建议</th>
                </tr>
              </thead>
              <tbody id="ew-risks-tbody"></tbody>
            </table>
          </div>

          <div id="ew-panel-points" class="se-table-scroll" style="flex:1;min-height:0" hidden>
            <table class="se-table">
              <thead>
                <tr>
                  <th>#</th><th>时刻</th><th>辐照(W/m²)</th><th>风速(m/s)</th><th>气温(℃)</th>
                  <th>风电(kW)</th><th>光伏(kW)</th><th>负荷(kW)</th><th>净负荷(kW)</th>
                  <th>储能SOC%</th><th>充放(kW)</th><th>绿电缺口(kW)</th>
                  <th>N-0负载%</th><th>N-1负载%</th><th>N-1最低V</th><th>风险等级</th><th>最严重事件</th>
                </tr>
              </thead>
              <tbody id="ew-points-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/assets/ew-app.js"></script>
</body>
</html>
