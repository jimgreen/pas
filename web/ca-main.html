<!doctype html>
<html lang="zh-CN" data-theme="minimalist-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>静态安全 CA · PAS 在线分析平台</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/se-dashboard.css">
  <link rel="icon" href="data:,">
  <script src="/assets/theme-registry.js"></script>
  <script src="/assets/pas-kit.js"></script>
</head>
<body data-page="/ca-main" data-wall-ready="1" class="se-main-body">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">P</span>
        <div><strong>PAS</strong><small data-i18n="brand.subtitle">在线分析平台</small></div>
      </div>
      <nav>
        <a href="/overview.html" data-route="overview" data-i18n="nav.overview">总览</a>
        <div class="nav-group">
          <span data-i18n="nav.analysis">分析功能</span>
          <a href="/se-main.html" data-route="se-root" data-i18n="nav.se">状态估计 SE</a>
          <a href="/lf-main.html" data-route="lf" data-i18n="nav.lf">潮流分析 LF</a>
          <a href="/ca-main.html" data-route="ca-root" class="active" data-i18n="nav.ca">静态安全 CA</a>
          <div class="nav-sub" role="group" aria-label="CA Pages">
            <a href="/ca-main.html" data-route="ca-main" class="active" data-i18n="nav.ca_main">主画面</a>
            <a href="/ca-risks.html" data-route="ca-risks" data-i18n="nav.ca_risks">风险与图谱</a>
            <a href="/ca-contingencies.html" data-route="ca-contingencies" data-i18n="nav.ca_contingencies">预想故障集</a>
            <a href="/ca-config.html" data-route="ca-config" data-i18n="nav.ca_config">参数与限值</a>
            <a href="/ca-logs.html" data-route="ca-logs" data-i18n="nav.ca_logs">运行日志</a>
          </div>
        </div>
        <div class="nav-group">
          <span data-i18n="nav.ops">运行管理</span>
          <a href="/runs.html" data-route="runs" data-i18n="nav.runs">运行历史</a>
          <a href="/settings.html" data-route="settings" data-i18n="nav.settings">系统设置</a>
        </div>
      </nav>
      <div class="sidebar-foot">
        <span class="status-dot" id="service-dot"></span>
        <span id="service-state" data-i18n="service.checking">服务检查中</span>
      </div>
    </aside>

    <main class="main se-main">
      <header class="se-topbar">
        <div class="se-title-group">
          <div class="se-title-row">
            <h1 data-i18n="title.ca_main">静态安全 CA</h1>
            <span id="ca-level-pill" class="se-pill neutral">—</span>
            <span id="ca-run-meta" class="se-run-meta tabular">—</span>
          </div>
        </div>
        <div class="se-top-actions">
          <button type="button" class="se-btn primary" id="btn-run-ca" data-i18n="action.run_ca">立即执行 CA</button>
          <button type="button" class="se-btn ghost" id="btn-refresh" data-i18n="action.refresh">刷新</button>
          <select id="theme-select" class="se-select compact" aria-label="Theme">
            <option value="minimalist-light" data-i18n="theme.light">极简明亮</option>
            <option value="precision-dark" data-i18n="theme.dark">精密暗黑</option>
            <option value="bento-grid" data-i18n="theme.bento">便当盒网格</option>
            <option value="glassmorphism" data-i18n="theme.glass">毛玻璃拟态</option>
            <option value="editorial" data-i18n="theme.editorial">编辑杂志</option>
            <option value="sci-fi-cyan" data-i18n="theme.cyan">科幻 · 电光青</option>
            <option value="sci-fi-purple" data-i18n="theme.purple">科幻 · 赛博紫</option>
            <option value="sci-fi-matrix" data-i18n="theme.matrix">科幻 · 矩阵绿</option>
          </select>
          <select id="lang-select" class="se-select compact" aria-label="Language">
            <option value="zh-CN">中文</option>
            <option value="en-US">English</option>
            <option value="ru-RU">Русский</option>
          </select>
        </div>
      </header>

      <div id="notice" class="notice" role="status" hidden></div>

      <div class="se-workspace" style="padding:8px 12px 10px">
        <div class="pas-screen-shell">
          <!-- 顶部大屏态势英雄带 -->
          <section class="pas-hero-strip" id="ca-hero-strip" aria-label="CA Key Metrics"></section>

          <!-- 核心三栏画布 -->
          <div class="se-home-grid" aria-label="CA Dashboard">
            <!-- 左栏：电网健康评分立体仪表盘 + 五维健康雷达 + 三道防线 + 风险分级环图 -->
            <section class="se-home-panel accent-stat">
              <div class="se-home-panel-head">
                <h2 data-i18n="home.security_overview">电网健康评估</h2>
                <span class="se-pill ok tabular" id="ca-home-score">—</span>
              </div>
              <div class="se-home-panel-body">
                <div id="ca-home-gauge"></div>
                <div class="pas-sub-hd">
                  <span data-i18n="home.health_radar">五维健康画像</span>
                  <span class="se-muted tabular" id="ca-home-elapsed">—</span>
                </div>
                <div id="ca-health-radar"></div>
                <div class="se-kv-divider"></div>
                <div class="pas-sub-hd">
                  <span data-i18n="home.defense_lines">N-0 / N-1 / N-k 安全防线</span>
                </div>
                <div id="ca-defense-bars"></div>
                <div class="se-kv-divider"></div>
                <div class="pas-sub-hd">
                  <span data-i18n="home.risk_dist">风险分级构成</span>
                  <span class="se-tag tabular" id="ca-home-total-risks">0</span>
                </div>
                <div id="ca-kv-severity"></div>
                <div class="se-home-actions" style="margin-top:auto;padding-top:6px;display:flex;gap:6px;flex-wrap:wrap">
                  <a class="se-btn mini primary" href="/ca-risks.html" data-i18n="nav.ca_risks">风险与图谱</a>
                  <a class="se-btn mini" href="/ca-contingencies.html" data-i18n="nav.ca_contingencies">故障集</a>
                  <a class="se-btn mini" href="/lf-main.html" id="ca-src-lf-link" data-i18n="home.view_source_lf">源 LF</a>
                </div>
              </div>
            </section>

            <div class="se-splitter is-v" data-split="v1" role="separator"></div>

            <!-- 中栏：预想故障全景热力矩阵墙 + 脆弱设备热力排行 -->
            <section class="se-home-panel accent-meas">
              <div class="se-home-panel-head">
                <h2 data-i18n="home.scan_matrix">预想故障全景矩阵</h2>
                <a class="se-more-link" style="margin:0" href="/ca-risks.html?tab=contingencies" data-i18n="action.more">全部 →</a>
              </div>
              <div class="se-home-panel-body">
                <div class="pas-sub-hd">
                  <div class="pas-heat-legend">
                    <span><i style="background:var(--sem-ok)"></i>安全</span>
                    <span><i style="background:var(--sem-warn)"></i>中</span>
                    <span><i style="background:#f97316"></i>高</span>
                    <span><i style="background:var(--sem-danger)"></i>严重/发散</span>
                  </div>
                  <span class="se-muted tabular" id="ca-matrix-meta">—</span>
                </div>
                <div id="ca-heat-matrix"></div>
                <div class="se-kv-divider"></div>
                <div class="pas-sub-hd">
                  <span data-i18n="home.device_heat">脆弱设备风险频次 Top</span>
                  <a class="se-more-link" style="margin:0;padding:0" href="/ca-config.html" data-i18n="nav.ca_config">限值…</a>
                </div>
                <div id="ca-device-heat"></div>
              </div>
            </section>

            <div class="se-splitter is-v" data-split="v2" role="separator"></div>

            <!-- 右栏：安全趋势 & 风险类型构成 + 高危风险与严重故障双表 -->
            <div class="se-home-right">
              <section class="se-home-panel accent-stat">
                <div class="se-home-panel-head">
                  <h2 data-i18n="home.trend_title">安全健康与风险趋势</h2>
                  <div class="se-tool-group">
                    <button type="button" class="se-chip-btn seg active" data-trend-metric="security_score" data-i18n="metric.score">健康评分</button>
                    <button type="button" class="se-chip-btn seg" data-trend-metric="health_history" data-i18n="metric.health_hist">健康历史</button>
                    <button type="button" class="se-chip-btn seg" data-trend-metric="total_risks" data-i18n="metric.total_risks">风险总数</button>
                    <button type="button" class="se-chip-btn seg" data-trend-metric="max_loading_pct" data-i18n="metric.max_loading">最大负载 %</button>
                    <button type="button" class="se-chip-btn seg" data-trend-metric="risk_categories" data-i18n="metric.risk_cat">风险分类</button>
                  </div>
                </div>
                <div class="se-home-panel-body" id="ca-home-trend"></div>
              </section>

              <div class="se-splitter is-h" data-split="h1" role="separator"></div>

              <div class="se-home-bottom-cards">
                <section class="se-home-panel accent-meas">
                  <div class="se-home-panel-head">
                    <h2 data-i18n="home.top_risks">高危风险排行</h2>
                    <a class="se-more-link" style="margin:0" href="/ca-risks.html" data-i18n="action.more">全部 →</a>
                  </div>
                  <div class="se-home-panel-body">
                    <div class="se-table-wrap">
                      <table class="se-table compact">
                        <colgroup>
                          <col style="width:44px">
                          <col style="width:36%">
                          <col style="width:30%">
                          <col style="width:74px">
                        </colgroup>
                        <thead>
                          <tr>
                            <th data-i18n="col.severity">等级</th>
                            <th data-i18n="col.contingency">故障场景</th>
                            <th data-i18n="col.device">设备</th>
                            <th data-i18n="col.violation">越限</th>
                          </tr>
                        </thead>
                        <tbody id="ca-home-top-risks"></tbody>
                      </table>
                    </div>
                  </div>
                </section>

                <div class="se-splitter is-v" data-split="v3" role="separator"></div>

                <section class="se-home-panel accent-ctrl">
                  <div class="se-home-panel-head">
                    <h2 data-i18n="home.top_contingencies">严重预想故障 Top</h2>
                    <a class="se-more-link" style="margin:0" href="/ca-risks.html?tab=contingencies" data-i18n="action.more">全部 →</a>
                  </div>
                  <div class="se-home-panel-body">
                    <div class="se-table-wrap">
                      <table class="se-table compact">
                        <colgroup>
                          <col>
                          <col style="width:46px">
                          <col style="width:52px">
                          <col style="width:44px">
                        </colgroup>
                        <thead>
                          <tr>
                            <th data-i18n="col.contingency">故障名</th>
                            <th data-i18n="col.conv">收敛</th>
                            <th data-i18n="col.load_loss">失电</th>
                            <th data-i18n="col.risk_cnt">风险</th>
                          </tr>
                        </thead>
                        <tbody id="ca-home-top-conts"></tbody>
                      </table>
                    </div>
                  </div>
                </section>
              </div>
            </div>
          </div>

          <!-- 底部通栏：最新 CA 运行日志 -->
          <a class="se-home-footer" id="ca-home-footer-log" href="/ca-logs.html">
            <span class="tag" id="ca-log-tag">INFO</span>
            <span class="se-muted tabular" id="ca-log-time">—</span>
            <span class="msg" id="ca-log-msg">—</span>
          </a>
        </div>
      </div>
    </main>
  </div>
  <script src="/assets/ca-app.js"></script>
</body>
</html>
