<!doctype html>
<html lang="zh-CN" data-theme="minimalist-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>预过滤量测管理 · 状态估计 SE · PAS</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/se-dashboard.css">
  <link rel="icon" href="data:,">
</head>
<body data-page="/se-prefilter" class="se-main-body">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">P</span>
        <div>
          <strong>PAS</strong>
          <small data-i18n="brand.sub">在线分析平台</small>
        </div>
      </div>
      <nav>
        <a href="/overview.html" data-route="overview" data-i18n="nav.overview">总览</a>
        <div class="nav-group">
          <span data-i18n="nav.analysis">分析功能</span>
          <a href="/se-main.html" data-route="se-root" class="nav-parent-active" data-i18n="nav.se_root">状态估计 SE</a>
          <div class="nav-sub">
            <a href="/se-main.html" data-route="se-main" data-i18n="nav.se_main">主画面</a>
            <a href="/se-flow.html" data-route="se-flow" data-i18n="nav.se_flow">潮流图</a>
            <a href="/se-curves.html" data-route="se-curves" data-i18n="nav.se_curves">历史曲线</a>
            <a href="/se-devices.html" data-route="se-devices" data-i18n="nav.se_devices">设备对比</a>
            <a href="/se-measurements.html" data-route="se-measurements" data-i18n="nav.se_measurements">有效实测明细</a>
            <a href="/se-params.html" data-route="se-params" data-i18n="nav.se_params">算法参数</a>
            <a href="/se-prefilter.html" data-route="se-prefilter" class="active" data-i18n="nav.se_prefilter">预过滤量测管理</a>
            <a href="/se-pseudo.html" data-route="se-pseudo" data-i18n="nav.se_pseudo">伪量测管理</a>
            <a href="/se-bad.html" data-route="se-bad" data-i18n="nav.se_bad">坏量测管理</a>
            <a href="/se-logs.html" data-route="se-logs" data-i18n="nav.se_logs">运行日志</a>
            <a href="/analysis/se.html" data-route="se" data-i18n="nav.se_detail">状态估计明细</a>
          </div>
          <a href="/analysis/lf.html" data-route="lf" data-i18n="nav.lf">潮流分析 LF</a>
          <a href="/analysis/ca.html" data-route="ca" data-i18n="nav.ca">静态安全 CA</a>
        </div>
        <div class="nav-group">
          <span data-i18n="nav.management">运行管理</span>
          <a href="/runs.html" data-route="runs" data-i18n="nav.runs">运行历史</a>
          <a href="/measurements.html" data-route="measurements" data-i18n="nav.measurements">设备量测</a>
          <a href="/limits.html" data-route="limits" data-i18n="nav.limits">安全限值</a>
          <a href="/workspace.html" data-route="workspace" data-i18n="nav.workspace">工作目录</a>
          <a href="/settings.html" data-route="settings" data-i18n="nav.settings">系统设置</a>
        </div>
      </nav>
      <div class="sidebar-foot">
        <span class="status-dot" id="service-dot"></span>
        <span id="service-state" data-i18n="service.checking">服务检查中</span>
      </div>
    </aside>

    <main class="main se-main">
      <header class="se-topbar">
        <div class="se-title-group">
          <div class="se-title-row">
            <h1 data-i18n="title.prefilter">预过滤量测管理</h1>
            <span id="pf-run-meta" class="se-run-meta tabular">—</span>
          </div>
        </div>
        <div class="se-top-actions">
          <button type="button" class="se-btn primary" id="btn-run-se" data-i18n="action.run_se">立即执行 SE</button>
          <button type="button" class="se-btn ghost" id="btn-refresh" data-i18n="action.refresh">刷新</button>
          <select id="theme-select" class="se-select compact" aria-label="Theme">
            <option value="minimalist-light" data-i18n="theme.light">极简明亮</option>
            <option value="precision-dark" data-i18n="theme.dark">精密暗黑</option>
            <option value="bento-grid" data-i18n="theme.bento">便当盒网格</option>
            <option value="glassmorphism" data-i18n="theme.glass">毛玻璃拟态</option>
            <option value="editorial" data-i18n="theme.editorial">编辑杂志</option>
            <option value="sci-fi-cyan" data-i18n="theme.cyan">科幻 · 电光青</option>
            <option value="sci-fi-purple" data-i18n="theme.purple">科幻 · 赛博紫</option>
            <option value="sci-fi-matrix" data-i18n="theme.matrix">科幻 · 矩阵绿</option>
          </select>
          <select id="lang-select" class="se-select compact" aria-label="Language">
            <option value="zh-CN">中文</option>
            <option value="en-US">English</option>
            <option value="ru-RU">Русский</option>
          </select>
        </div>
      </header>

      <div id="notice" class="notice" role="status" hidden></div>

      <section class="se-kpi-strip cols-4" aria-label="KPI">
        <article class="se-kpi-card">
          <div class="se-kpi-head"><span data-i18n="kpi.total">预过滤量测</span></div>
          <div class="se-kpi-val tabular"><strong id="kpi-pf-total">0</strong></div>
        </article>
        <article class="se-kpi-card">
          <div class="se-kpi-head"><span data-i18n="kpi.rule_hit">规则命中</span></div>
          <div class="se-kpi-val tabular"><strong id="kpi-pf-rule">0</strong></div>
        </article>
        <article class="se-kpi-card">
          <div class="se-kpi-head"><span data-i18n="kpi.kernel">内核预过滤</span></div>
          <div class="se-kpi-val tabular"><strong id="kpi-pf-kernel">0</strong></div>
        </article>
        <article class="se-kpi-card">
          <div class="se-kpi-head"><span data-i18n="kpi.rules">预过滤规则</span></div>
          <div class="se-kpi-val tabular"><strong id="kpi-rules-enabled">0</strong><small id="kpi-rules-total">/ 0</small></div>
        </article>
      </section>

      <nav class="se-view-tabs" id="pf-tabs" role="tablist">
        <button type="button" class="se-tab active" data-view="results" role="tab" data-i18n="tab.results">预过滤明细</button>
        <button type="button" class="se-tab" data-view="rules" role="tab" data-i18n="tab.rules">预过滤规则</button>
        <button type="button" class="se-tab" data-view="analysis" role="tab" data-i18n="tab.analysis">趋势与分布</button>
      </nav>

      <div class="se-workspace">
        <!-- 1. 预过滤明细 -->
        <section class="se-panel active" data-panel="results">
          <div class="se-card se-full-card">
            <div class="se-toolbar">
              <div class="se-tool-group wrap">
                <div class="se-segmented" id="pf-origin-seg">
                  <button type="button" class="seg active" data-origin="all" data-i18n="common.all">全部</button>
                  <button type="button" class="seg" data-origin="rule" data-i18n="origin.rule">规则命中</button>
                  <button type="button" class="seg" data-origin="kernel" data-i18n="origin.kernel">内核预过滤</button>
                  <button type="button" class="seg" data-origin="policy" data-i18n="origin.policy">策略屏蔽</button>
                </div>
                <select id="pf-res-type" class="se-select compact" aria-label="Device type"></select>
                <input id="pf-res-search" class="se-input compact" type="search" data-i18n-placeholder="ph.search" placeholder="筛选设备/量测">
              </div>
              <div class="se-tool-group">
                <span class="se-muted tabular" id="pf-res-meta">—</span>
              </div>
            </div>
            <div class="se-table-scroll" id="pf-res-table"></div>
            <div class="se-pager" id="pf-res-pager"></div>
          </div>
        </section>

        <!-- 2. 预过滤规则 -->
        <section class="se-panel" data-panel="rules">
          <div class="se-card se-full-card">
            <div class="se-toolbar">
              <div class="se-tool-group wrap">
                <select id="pf-rule-type-filter" class="se-select compact" aria-label="Device type"></select>
                <select id="pf-rule-kind-filter" class="se-select compact" aria-label="Rule type">
                  <option value="" data-i18n="common.all">全部</option>
                  <option value="range" data-i18n="rule.range">上下限越界</option>
                  <option value="force_filter" data-i18n="rule.force">强制预过滤</option>
                </select>
                <input id="pf-rule-search" class="se-input compact" type="search" data-i18n-placeholder="ph.search" placeholder="筛选设备/指标">
              </div>
              <div class="se-tool-group">
                <button type="button" class="se-btn primary" id="btn-add-rule" data-i18n="btn.add_rule">+ 新增规则</button>
              </div>
            </div>
            <div class="se-table-scroll" id="pf-rule-table"></div>
          </div>
        </section>

        <!-- 3. 趋势与分布 -->
        <section class="se-panel" data-panel="analysis">
          <div class="se-curves-grid">
            <article class="se-card se-chart-card">
              <div class="se-toolbar">
                <h2 data-i18n="ana.trend_title">预过滤数量趋势</h2>
                <select id="pf-trend-limit" class="se-select compact" aria-label="Window">
                  <option value="30">30</option>
                  <option value="60" selected>60</option>
                  <option value="120">120</option>
                </select>
              </div>
              <div class="se-chart-host" id="pf-trend-chart"></div>
            </article>
            <div class="se-split-grid" style="grid-template-columns: repeat(2, minmax(0, 1fr));">
              <article class="se-card se-full-card">
                <div class="se-toolbar"><h2 data-i18n="ana.by_reason">按原因分布</h2></div>
                <div class="se-stage-bars" id="pf-reason-bars"></div>
              </article>
              <article class="se-card se-full-card">
                <div class="se-toolbar"><h2 data-i18n="ana.by_devtype">按设备类型分布</h2></div>
                <div class="se-stage-bars" id="pf-devtype-bars"></div>
              </article>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- 新增/编辑预过滤规则模态框 -->
  <dialog id="rule-dialog" class="se-modal wide" aria-labelledby="rule-dlg-title">
    <h3 id="rule-dlg-title" data-i18n="dlg.rule_title">预过滤规则</h3>
    <form id="rule-form" class="se-form-grid">
      <input type="hidden" name="id" value="">
      <label class="se-field">
        <span data-i18n="col.scope">作用域</span>
        <select name="scope" id="fr-scope">
          <option value="device_type" data-i18n="scope.type">按设备类 (*)</option>
          <option value="device" data-i18n="scope.device">按单设备</option>
        </select>
      </label>
      <label class="se-field">
        <span data-i18n="col.device_type">设备类型</span>
        <select name="device_type" id="fr-dev-type" required></select>
      </label>
      <label class="se-field" id="fr-dev-wrap" hidden>
        <span data-i18n="col.device_name">目标设备</span>
        <select name="device_name" id="fr-dev-name"></select>
      </label>
      <label class="se-field">
        <span data-i18n="col.metric">量测指标</span>
        <select name="metric" id="fr-metric" required></select>
      </label>
      <label class="se-field">
        <span data-i18n="col.rule_type">规则类型</span>
        <select name="rule_type" id="fr-rule-type">
          <option value="range" data-i18n="rule.range">上下限越界</option>
          <option value="force_filter" data-i18n="rule.force">强制预过滤</option>
        </select>
      </label>
      <label class="se-field">
        <span data-i18n="col.status">状态</span>
        <select name="enabled" id="fr-enabled">
          <option value="1" data-i18n="common.enabled">启用</option>
          <option value="0" data-i18n="common.disabled">停用</option>
        </select>
      </label>
      <label class="se-field" id="fr-min-wrap">
        <span data-i18n="col.min">下限 Min</span>
        <input type="number" step="any" name="min_value" id="fr-min">
      </label>
      <label class="se-field" id="fr-max-wrap">
        <span data-i18n="col.max">上限 Max</span>
        <input type="number" step="any" name="max_value" id="fr-max">
      </label>
      <label class="se-field full">
        <span data-i18n="col.note">备注</span>
        <input type="text" name="note" id="fr-note" maxlength="200">
      </label>
      <div class="se-modal-actions full">
        <button type="button" class="se-btn ghost" id="btn-rule-cancel" data-i18n="action.cancel">取消</button>
        <button type="submit" class="se-btn primary" data-i18n="action.save">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 高危删除模态确认框 -->
  <dialog id="confirm-dialog" class="se-modal" aria-labelledby="confirm-title">
    <h3 id="confirm-title"></h3>
    <p id="confirm-desc" class="se-modal-desc"></p>
    <div class="se-modal-actions">
      <button type="button" class="se-btn ghost" id="btn-confirm-cancel" autofocus data-i18n="action.cancel">取消</button>
      <button type="button" class="se-btn danger" id="btn-confirm-ok" data-i18n="action.delete">删除</button>
    </div>
  </dialog>

  <script src="/assets/se-common.js"></script>
  <script src="/assets/se-prefilter.js"></script>
</body>
</html>
