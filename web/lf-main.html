<!doctype html>
<html lang="zh-CN" data-theme="minimalist-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PAS · 潮流计算主画面</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/se-dashboard.css">
  <link rel="icon" href="data:,">
  <script src="/assets/theme-registry.js"></script>
  <script src="/assets/pas-kit.js"></script>
</head>
<body data-page="/lf-main" data-lf-view="home" data-wall-ready="1" class="se-main-body">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">P</span>
        <div>
          <strong>PAS</strong>
          <small data-i18n="brand.sub">在线分析平台</small>
        </div>
      </div>
      <nav>
        <a href="/overview.html" data-route="overview" data-i18n="nav.overview">总览</a>
        <div class="nav-group">
          <span data-i18n="nav.analysis">分析功能</span>
          <a href="/se-main.html" data-route="se-root" data-i18n="nav.se_root">状态估计 SE</a>
          <a href="/lf-main.html" data-route="lf-root" class="active" data-i18n="nav.lf_root">潮流分析 LF</a>
          <div class="nav-sub" role="group" aria-label="LF Modules">
            <a href="/lf-main.html" data-route="lf-main" class="active" data-i18n="nav.lf_main">主画面</a>
            <a href="/lf-flow.html" data-route="lf-flow" data-i18n="nav.lf_flow">潮流图</a>
            <a href="/lf-results.html" data-route="lf-results" data-i18n="nav.lf_results">潮流明细</a>
            <a href="/lf-params.html" data-route="lf-params" data-i18n="nav.lf_params">参数与方式</a>
            <a href="/lf-logs.html" data-route="lf-logs" data-i18n="nav.lf_logs">运行日志</a>
          </div>
          <a href="/ca-main.html" data-route="ca" data-i18n="nav.ca">静态安全 CA</a>
        </div>
        <div class="nav-group">
          <span data-i18n="nav.management">运行管理</span>
          <a href="/runs.html" data-route="runs" data-i18n="nav.runs">运行历史</a>
          <a href="/settings.html" data-route="settings" data-i18n="nav.settings">系统设置</a>
        </div>
      </nav>
      <div class="sidebar-foot">
        <span class="status-dot" id="service-dot"></span>
        <span id="service-state" data-i18n="service.checking">服务检查中</span>
      </div>
    </aside>

    <main class="main se-main">
      <header class="se-topbar">
        <div class="se-title-group">
          <div class="se-title-row">
            <h1 data-i18n="title.lf_main">潮流分析 LF</h1>
            <span id="lf-status-pill" class="se-pill neutral">—</span>
            <span id="lf-run-meta" class="se-run-meta tabular">—</span>
          </div>
        </div>
        <div class="se-top-actions">
          <button type="button" class="se-btn primary" id="btn-run-lf" data-i18n="action.run_lf">执行 LF</button>
          <button type="button" class="se-chip-btn" id="btn-auto-refresh" data-i18n="action.auto_refresh">自刷</button>
          <button type="button" class="se-btn ghost" id="btn-refresh" data-i18n="action.refresh">刷新</button>
          <select id="theme-select" class="se-select compact" aria-label="Theme">
            <option value="minimalist-light" data-i18n="theme.light">极简明亮</option>
            <option value="precision-dark" data-i18n="theme.dark">精密暗黑</option>
            <option value="bento-grid" data-i18n="theme.bento">便当盒网格</option>
            <option value="glassmorphism" data-i18n="theme.glass">毛玻璃拟态</option>
            <option value="editorial" data-i18n="theme.editorial">编辑杂志</option>
            <option value="sci-fi-cyan" data-i18n="theme.cyan">科幻 · 电光青</option>
            <option value="sci-fi-purple" data-i18n="theme.purple">科幻 · 赛博紫</option>
            <option value="sci-fi-matrix" data-i18n="theme.matrix">科幻 · 矩阵绿</option>
          </select>
          <select id="lang-select" class="se-select compact" aria-label="Language">
            <option value="zh-CN">中文</option>
            <option value="en-US">English</option>
            <option value="ru-RU">Русский</option>
          </select>
        </div>
      </header>

      <div id="notice" class="notice" role="status" hidden></div>

      <div class="se-workspace" style="padding:8px 12px 10px">
        <div class="pas-screen-shell">
          <!-- 顶部大屏态势英雄带 -->
          <section class="pas-hero-strip" id="lf-hero-strip" aria-label="LF Key Metrics"></section>

          <!-- 核心三栏画布 -->
          <div class="se-home-grid" id="lf-home-grid">
            <!-- 左栏：动态光流交直流桑基图 + 源荷结构 + 换流器工况 -->
            <section class="se-home-panel accent-stat">
              <div class="se-home-panel-head">
                <h2 data-i18n="home.energy_hub">交直流能量流中枢</h2>
                <a class="se-more-link" style="margin:0" href="/lf-flow.html" data-i18n="nav.lf_flow">潮流图 →</a>
              </div>
              <div class="se-home-panel-body">
                <div class="pas-sub-hd">
                  <span data-i18n="home.sankey_sub">交直流能量流（动态桑基）</span>
                  <span class="se-muted tabular" id="lf-sankey-meta">—</span>
                </div>
                <div id="lf-home-sankey"></div>
                <div class="se-kv-divider"></div>
                <div class="pas-sub-hd">
                  <span data-i18n="home.acdc_mix">交直流源荷结构</span>
                  <span class="se-muted tabular" id="lf-mix-meta">—</span>
                </div>
                <div id="lf-home-mix-donut"></div>
                <div class="se-kv-divider"></div>
                <div class="pas-sub-hd">
                  <span data-i18n="home.converters">互联换流器 / 分域工况</span>
                  <a class="se-more-link" style="margin:0;padding:0" href="/lf-results.html?kind=branches" data-i18n="link.more">更多…</a>
                </div>
                <div id="lf-home-converters"></div>
              </div>
            </section>

            <div class="se-splitter is-v" data-split="v1" role="separator"></div>

            <!-- 中栏：电压/负载双直方图体检 + 求解基态与方式 -->
            <section class="se-home-panel accent-ctrl">
              <div class="se-home-panel-head">
                <h2 data-i18n="home.grid_health">全网电压与负载分布</h2>
                <a class="se-more-link" style="margin:0" href="/lf-params.html" data-i18n="nav.lf_params">方式…</a>
              </div>
              <div class="se-home-panel-body">
                <div class="pas-sub-hd">
                  <span data-i18n="home.v_dist">母线电压区间分布 (pu)</span>
                  <span class="se-muted tabular" id="lf-vdist-meta">—</span>
                </div>
                <div id="lf-home-vbins"></div>
                <div class="se-kv-divider"></div>
                <div class="pas-sub-hd">
                  <span data-i18n="home.l_dist">支路负载率区间分布 (%)</span>
                  <span class="se-muted tabular" id="lf-ldist-meta">—</span>
                </div>
                <div id="lf-home-lbins"></div>
                <div class="se-kv-divider"></div>
                <div class="pas-sub-hd">
                  <span data-i18n="home.base_state">求解基态与方式</span>
                  <span id="lf-se-src-link"></span>
                </div>
                <div class="pas-chip-grid" id="lf-home-base-chips"></div>
              </div>
            </section>

            <div class="se-splitter is-v" data-split="v2" role="separator"></div>

            <!-- 右栏：多指标趋势曲线 + 下方重过载与电压偏差双卡 -->
            <div class="se-home-right">
              <section class="se-home-panel accent-stat">
                <div class="se-home-rate-bar">
                  <div class="se-home-rate-items" id="lf-home-rate-items"></div>
                  <div class="se-tool-group" id="lf-home-chart-seg">
                    <button type="button" class="se-chip-btn seg active" data-hmetric="loss_rate" data-i18n="metric.loss_rate">网损率 %</button>
                    <button type="button" class="se-chip-btn seg" data-hmetric="max_loading_pct" data-i18n="metric.max_load">最大负载 %</button>
                    <button type="button" class="se-chip-btn seg" data-hmetric="total_load_p" data-i18n="metric.total_load">总负荷</button>
                    <button type="button" class="se-chip-btn seg" data-hmetric="min_v_pu" data-i18n="metric.min_v">最低电压 pu</button>
                  </div>
                </div>
                <div class="se-home-chart-wrap">
                  <div class="se-home-chart-host" id="lf-home-chart"></div>
                </div>
              </section>

              <div class="se-splitter is-h" data-split="h1" role="separator"></div>

              <div class="se-home-bottom-cards">
                <section class="se-home-panel accent-meas">
                  <div class="se-home-panel-head">
                    <h2 data-i18n="home.top_load">重过载排行</h2>
                    <a class="se-more-link" style="margin:0" href="/lf-results.html?kind=branches" data-i18n="link.more">更多…</a>
                  </div>
                  <div class="se-home-panel-body" id="lf-home-top-load"></div>
                </section>

                <div class="se-splitter is-v" data-split="v3" role="separator"></div>

                <section class="se-home-panel accent-stat">
                  <div class="se-home-panel-head">
                    <h2 data-i18n="home.v_extremes">电压偏差与越限</h2>
                    <a class="se-more-link" style="margin:0" href="/lf-results.html?kind=buses" data-i18n="link.more">更多…</a>
                  </div>
                  <div class="se-home-panel-body" id="lf-home-v-extremes"></div>
                </section>
              </div>
            </div>
          </div>

          <!-- 底部通栏：最新 LF 运行日志 -->
          <a class="se-home-footer" id="lf-home-footer-log" href="/lf-logs.html">
            <span class="tag" id="lf-log-tag">INFO</span>
            <span class="se-muted tabular" id="lf-log-time">—</span>
            <span class="msg" id="lf-log-msg">—</span>
          </a>
        </div>
      </div>
    </main>
  </div>
  <script src="/assets/lf-app.js"></script>
</body>
</html>
