<!doctype html>
<html lang="zh-CN" data-theme="minimalist-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PAS · LF 运行日志</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/se-dashboard.css">
  <link rel="icon" href="data:,">
  <script src="/assets/theme-registry.js"></script>
  <script src="/assets/pas-kit.js"></script>
</head>
<body data-page="/lf-logs" data-lf-view="logs" class="se-main-body">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">P</span>
        <div>
          <strong>PAS</strong>
          <small data-i18n="brand.sub">在线分析平台</small>
        </div>
      </div>
      <nav>
        <a href="/overview.html" data-route="overview" data-i18n="nav.overview">总览</a>
        <div class="nav-group">
          <span data-i18n="nav.analysis">分析功能</span>
          <a href="/se-main.html" data-route="se-root" data-i18n="nav.se_root">状态估计 SE</a>
          <a href="/lf-main.html" data-route="lf-root" class="active" data-i18n="nav.lf_root">潮流分析 LF</a>
          <div class="nav-sub" role="group" aria-label="LF Modules">
            <a href="/lf-main.html" data-route="lf-main" data-i18n="nav.lf_main">主画面</a>
            <a href="/lf-flow.html" data-route="lf-flow" data-i18n="nav.lf_flow">潮流图</a>
            <a href="/lf-results.html" data-route="lf-results" data-i18n="nav.lf_results">潮流明细</a>
            <a href="/lf-params.html" data-route="lf-params" data-i18n="nav.lf_params">参数与方式</a>
            <a href="/lf-logs.html" data-route="lf-logs" class="active" data-i18n="nav.lf_logs">运行日志</a>
          </div>
          <a href="/ca-main.html" data-route="ca" data-i18n="nav.ca">静态安全 CA</a>
        </div>
        <div class="nav-group">
          <span data-i18n="nav.management">运行管理</span>
          <a href="/runs.html" data-route="runs" data-i18n="nav.runs">运行历史</a>
          <a href="/settings.html" data-route="settings" data-i18n="nav.settings">系统设置</a>
        </div>
      </nav>
      <div class="sidebar-foot">
        <span class="status-dot" id="service-dot"></span>
        <span id="service-state" data-i18n="service.checking">服务检查中</span>
      </div>
    </aside>

    <main class="main se-main">
      <header class="se-topbar">
        <div class="se-title-group">
          <div class="se-title-row">
            <h1 data-i18n="title.lf_logs">LF 运行日志</h1>
          </div>
        </div>
        <div class="se-top-actions">
          <button type="button" class="se-btn primary" id="btn-run-lf" data-i18n="action.run_lf">立即执行 LF</button>
          <button type="button" class="se-btn ghost" id="btn-refresh" data-i18n="action.refresh">刷新</button>
          <select id="theme-select" class="se-select compact" aria-label="Theme">
            <option value="minimalist-light" data-i18n="theme.light">极简明亮</option>
            <option value="precision-dark" data-i18n="theme.dark">精密暗黑</option>
            <option value="bento-grid" data-i18n="theme.bento">便当盒网格</option>
            <option value="glassmorphism" data-i18n="theme.glass">毛玻璃拟态</option>
            <option value="editorial" data-i18n="theme.editorial">编辑杂志</option>
            <option value="sci-fi-cyan" data-i18n="theme.cyan">科幻 · 电光青</option>
            <option value="sci-fi-purple" data-i18n="theme.purple">科幻 · 赛博紫</option>
            <option value="sci-fi-matrix" data-i18n="theme.matrix">科幻 · 矩阵绿</option>
          </select>
          <select id="lang-select" class="se-select compact" aria-label="Language">
            <option value="zh-CN">中文</option>
            <option value="en-US">English</option>
            <option value="ru-RU">Русский</option>
          </select>
        </div>
      </header>

      <div id="notice" class="notice" role="status" hidden></div>

      <section class="se-kpi-strip cols-4" aria-label="KPI">
        <article class="se-kpi-card"><div class="se-kpi-head"><span data-i18n="logs.total">日志总数</span></div><div class="se-kpi-val tabular"><strong id="lf-kpi-log-total">0</strong></div></article>
        <article class="se-kpi-card"><div class="se-kpi-head"><span data-i18n="logs.err24">24h ERR/WARN</span></div><div class="se-kpi-val tabular"><strong id="lf-kpi-err">0</strong><small id="lf-kpi-warn">/ 0</small></div></article>
        <article class="se-kpi-card"><div class="se-kpi-head"><span data-i18n="logs.ret">保留天数</span></div><div class="se-kpi-val tabular"><strong id="lf-kpi-ret">30</strong></div></article>
        <article class="se-kpi-card"><div class="se-kpi-head"><span data-i18n="logs.pending">待清理</span></div><div class="se-kpi-val tabular"><strong id="lf-kpi-pend">0</strong></div></article>
      </section>

      <nav class="se-view-tabs" id="lf-logs-tabs" role="tablist">
        <button type="button" class="se-tab active" data-lsub="stream" data-i18n="logs.tab_stream">日志明细</button>
        <button type="button" class="se-tab" data-lsub="runs" data-i18n="logs.tab_runs">运行与策略</button>
      </nav>

      <div class="se-workspace">
        <section class="se-panel active" data-lpanel="stream">
          <div class="se-card se-full-card">
            <div class="se-toolbar">
              <div class="se-tool-group wrap">
                <select id="lf-log-level" class="se-select compact"><option value="" data-i18n="common.all">全部</option><option value="ERROR">ERROR</option><option value="WARN">WARN</option><option value="INFO">INFO</option></select>
                <select id="lf-log-stage" class="se-select compact"><option value="all" data-i18n="common.all">全部</option><option value="trigger">trigger</option><option value="se_import">se_import</option><option value="override_apply">override_apply</option><option value="solve">solve</option><option value="persist">persist</option><option value="param_change">param_change</option><option value="override_change">override_change</option><option value="cleanup">cleanup</option></select>
                <select id="lf-log-window" class="se-select compact"><option value="all" data-i18n="common.all">全部</option><option value="1h">1h</option><option value="24h">24h</option><option value="7d">7d</option></select>
                <input id="lf-log-runid" class="se-input compact" type="number" min="1" style="width:92px" placeholder="Run ID">
                <input id="lf-log-search" class="se-input compact" type="search" data-i18n-placeholder="ph.search_log" placeholder="搜索日志">
              </div>
              <div class="se-tool-group">
                <button type="button" class="se-btn mini" id="btn-lf-logs-export" data-i18n="action.export_csv">导出 CSV</button>
              </div>
            </div>
            <div class="se-table-scroll" id="lf-log-table-wrap"></div>
            <div class="se-pager" id="lf-log-pager"></div>
          </div>
        </section>

        <section class="se-panel" data-lpanel="runs">
          <div class="pas-runs-policy-grid">
            <div class="pas-table-fill-card">
              <div class="se-toolbar"><h2 style="margin:0;font-size:13px;font-weight:700" data-i18n="logs.runs_title">LF 历史运行记录</h2></div>
              <div class="se-table-scroll" id="lf-runs-table-wrap"></div>
            </div>
            <div class="pas-runs-policy-side">
              <div class="se-home-card">
                <div class="se-home-card-head"><h2 data-i18n="sched.title">LF 周期调度</h2></div>
                <form id="lf-schedule-form" class="se-sched-form">
                  <label class="se-field"><span data-i18n="sched.period">周期 (s)</span><input name="period_seconds" class="tabular" type="number" min="5" max="86400" value="60" required></label>
                  <label class="se-check-inline"><input type="checkbox" name="enabled"><span data-i18n="sched.enabled">启用周期自动执行</span></label>
                  <div class="se-tool-group">
                    <button type="submit" class="se-btn primary mini" data-i18n="sched.save">保存调度</button>
                    <button type="button" class="se-btn ghost mini" id="btn-daemon-start" data-i18n="sched.start">启动周期</button>
                    <button type="button" class="se-btn ghost mini" id="btn-daemon-stop" data-i18n="sched.stop">停止周期</button>
                  </div>
                </form>
              </div>

              <div class="se-home-card">
                <div class="se-home-card-head"><h2 data-i18n="logs.tab_policy">日志清理策略</h2></div>
                <form id="lf-log-policy-form" class="se-form-grid cols-2">
                  <label class="se-field"><span data-i18n="logs.pol_enabled">自动清理</span><select id="lfp-enabled"><option value="1">ON</option><option value="0">OFF</option></select></label>
                  <label class="se-field"><span data-i18n="logs.ret">常规保留天数</span><input id="lfp-ret" class="tabular" type="number" min="1" max="3650" value="30"></label>
                  <label class="se-field"><span data-i18n="logs.err_ret">ERROR 保留天数</span><input id="lfp-err" class="tabular" type="number" min="1" max="3650" value="90"></label>
                  <label class="se-field"><span data-i18n="logs.max_rows">最大保留条数</span><input id="lfp-max" class="tabular" type="number" min="100" max="5000000" value="50000"></label>
                  <div class="se-tool-group" style="grid-column:1 / -1">
                    <button type="submit" class="se-btn primary mini" data-i18n="params.save">保存策略</button>
                    <button type="button" class="se-btn danger-ghost mini" id="btn-lf-purge" data-i18n="logs.purge_now">立即按策略清理</button>
                  </div>
                </form>
              </div>

              <div class="se-home-card" style="flex:1">
                <div class="se-home-card-head"><h2>阶段日志分布</h2></div>
                <div class="se-kv-list" id="lf-stage-stats"></div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <dialog id="confirm-dialog" class="se-modal" aria-labelledby="confirm-title">
    <h3 id="confirm-title">—</h3>
    <p id="confirm-desc" class="se-modal-desc">—</p>
    <div class="se-modal-actions">
      <button type="button" class="se-btn ghost" id="btn-confirm-cancel" autofocus data-i18n="action.cancel">取消</button>
      <button type="button" class="se-btn danger" id="btn-confirm-ok" data-i18n="action.confirm">确认</button>
    </div>
  </dialog>

  <script src="/assets/lf-app.js"></script>
</body>
</html>
