<!doctype html>
<html lang="zh-CN" data-theme="minimalist-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>全量测分析 · 状态估计 SE · PAS</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/se-dashboard.css">
  <link rel="icon" href="data:,">
  <script src="/assets/theme-registry.js"></script>
  <script src="/assets/pas-kit.js"></script>
</head>
<body data-page="/se-measurements" data-se-view="measurements" class="se-main-body">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">P</span>
        <div>
          <strong>PAS</strong>
          <small data-i18n="brand.sub">在线分析平台</small>
        </div>
      </div>
      <nav>
        <a href="/overview.html" data-route="overview" data-i18n="nav.overview">总览</a>
        <div class="nav-group">
          <span data-i18n="nav.analysis">分析功能</span>
          <a href="/se-main.html" data-route="se-root" class="nav-parent-active" data-i18n="nav.se_root">状态估计 SE</a>
          <div class="nav-sub">
            <a href="/se-main.html" data-route="se-main" data-i18n="nav.se_main">主画面</a>
            <a href="/se-flow.html" data-route="se-flow" data-i18n="nav.se_flow">潮流图</a>
            <a href="/se-curves.html" data-route="se-curves" data-i18n="nav.se_curves">历史曲线</a>
            <a href="/se-measurements.html" data-route="se-measurements" class="active" data-i18n="nav.se_measurements">全量测分析</a>
            <a href="/se-params.html" data-route="se-params" data-i18n="nav.se_params">算法参数</a>
            <a href="/se-prefilter.html" data-route="se-prefilter" data-i18n="nav.se_prefilter">预过滤量测</a>
            <a href="/se-pseudo.html" data-route="se-pseudo" data-i18n="nav.se_pseudo">伪量测</a>
            <a href="/se-bad.html" data-route="se-bad" data-i18n="nav.se_bad">坏量测</a>
            <a href="/se-logs.html" data-route="se-logs" data-i18n="nav.se_logs">运行日志</a>
          </div>
          <a href="/lf-main.html" data-route="lf" data-i18n="nav.lf">潮流分析 LF</a>
          <a href="/ca-main.html" data-route="ca" data-i18n="nav.ca">静态安全 CA</a>
        </div>
        <div class="nav-group">
          <span data-i18n="nav.management">运行管理</span>
          <a href="/runs.html" data-route="runs" data-i18n="nav.runs">运行历史</a>
          <a href="/measurements.html" data-route="measurements" data-i18n="nav.measurements">设备量测</a>
          <a href="/limits.html" data-route="limits" data-i18n="nav.limits">安全限值</a>
          <a href="/workspace.html" data-route="workspace" data-i18n="nav.workspace">工作目录</a>
          <a href="/settings.html" data-route="settings" data-i18n="nav.settings">系统设置</a>
        </div>
      </nav>
      <div class="sidebar-foot">
        <span class="status-dot" id="service-dot"></span>
        <span id="service-state" data-i18n="service.checking">服务检查中</span>
      </div>
    </aside>

    <main class="main se-main">
      <header class="se-topbar">
        <div class="se-title-group">
          <div class="se-title-row">
            <h1 data-i18n="title.measurements">全量测分析</h1>
            <span id="se-conv-pill" class="se-pill neutral">—</span>
            <select id="se-run-select" class="se-select compact tabular" aria-label="Snapshot"></select>
            <span id="se-run-meta" class="se-run-meta tabular" hidden>—</span>
          </div>
        </div>
        <div class="se-top-actions">
          <button type="button" class="se-btn primary" id="btn-run-se" data-i18n="action.run_se">立即执行 SE</button>
          <button type="button" class="se-btn ghost" id="btn-refresh" data-i18n="action.refresh">刷新</button>
          <select id="theme-select" class="se-select compact" aria-label="Theme">
            <option value="minimalist-light" data-i18n="theme.light">极简明亮</option>
            <option value="precision-dark" data-i18n="theme.dark">精密暗黑</option>
            <option value="bento-grid" data-i18n="theme.bento">便当盒网格</option>
            <option value="glassmorphism" data-i18n="theme.glass">毛玻璃拟态</option>
            <option value="editorial" data-i18n="theme.editorial">编辑杂志</option>
            <option value="sci-fi-cyan" data-i18n="theme.cyan">科幻 · 电光青</option>
            <option value="sci-fi-purple" data-i18n="theme.purple">科幻 · 赛博紫</option>
            <option value="sci-fi-matrix" data-i18n="theme.matrix">科幻 · 矩阵绿</option>
          </select>
          <select id="lang-select" class="se-select compact" aria-label="Language">
            <option value="zh-CN">中文</option>
            <option value="en-US">English</option>
            <option value="ru-RU">Русский</option>
          </select>
        </div>
      </header>

      <div id="notice" class="notice" role="status" hidden></div>

      <div class="se-workspace" id="se-workspace">
        <section class="se-panel active" data-panel="measurements">
          <div class="se-card se-full-card">
            <div class="se-toolbar" id="meas-sub-tabs-bar">
              <div class="se-tool-group wrap">
                <div class="se-tool-group" id="meas-subtab-seg" role="tablist">
                  <button type="button" class="se-chip-btn seg active" data-msub="list" data-i18n="meas.tab_list">全量测明细</button>
                  <button type="button" class="se-chip-btn seg" data-msub="devices" data-i18n="meas.tab_devices">设备对比</button>
                  <button type="button" class="se-chip-btn seg" data-msub="balance" data-i18n="meas.tab_balance">母线平衡与可观测</button>
                </div>
                <div class="se-tool-group wrap" id="meas-list-controls">
                  <div class="se-tool-group" id="meas-source-seg" role="group" aria-label="Source filter">
                    <button type="button" class="se-chip-btn seg active" data-msrc="all" data-i18n="meas.all">全部</button>
                    <button type="button" class="se-chip-btn seg" data-msrc="normal" data-i18n="meas.normal">正常</button>
                    <button type="button" class="se-chip-btn seg warn" data-msrc="bad_data" data-i18n="meas.bad">坏数据</button>
                    <button type="button" class="se-chip-btn seg" data-msrc="prefiltered" data-i18n="meas.prefiltered">预过滤</button>
                    <button type="button" class="se-chip-btn seg" data-msrc="pseudo" data-i18n="meas.pseudo">伪量测</button>
                  </div>
                  <button type="button" class="se-chip-btn warn" id="btn-meas-high-res" data-i18n="meas.high_res">仅大残差</button>
                  <select id="meas-devtype-select" class="se-select compact" aria-label="Device type"></select>
                  <select id="meas-sort-select" class="se-select compact" aria-label="Sort">
                    <option value="abs_residual" data-i18n="sort.abs_res">残差绝对值</option>
                    <option value="abs_norm_residual" data-i18n="sort.abs_norm">标准化残差</option>
                    <option value="meas_value" data-i18n="col.meas">实测值</option>
                    <option value="se_value" data-i18n="col.se">估计值</option>
                    <option value="meas_id" data-i18n="sort.id">量测序号</option>
                    <option value="device_name" data-i18n="sort.dev">设备名称</option>
                  </select>
                  <button type="button" class="se-btn mini tabular" id="btn-meas-dir" title="Toggle sort order">↓</button>
                  <input id="meas-search-input" class="se-input compact" type="search" data-i18n-placeholder="ph.search_meas" placeholder="搜索设备/量测 ( / )">
                </div>
                <div class="se-tool-group wrap" id="meas-devices-controls" hidden>
                  <select id="dev-type-select" class="se-select compact" aria-label="Device table"></select>
                  <div class="se-segmented" id="dev-mode-seg" role="group" aria-label="Display mode">
                    <button type="button" class="seg active" data-dmode="compare" data-i18n="dev.mode_compare">Meas / SE</button>
                    <button type="button" class="seg" data-dmode="delta" data-i18n="dev.mode_delta">残差 Δ</button>
                  </div>
                  <input id="dev-search-input" class="se-input compact" type="search" data-i18n-placeholder="ph.search_device" placeholder="筛选设备编号或名称">
                  <label class="se-check-inline">
                    <input type="checkbox" id="dev-bad-only">
                    <span data-i18n="devices.bad_only">仅坏数据设备</span>
                  </label>
                  <span class="se-muted tabular" id="dev-count-summary">—</span>
                  <button type="button" class="se-btn mini" id="btn-export-devices" data-i18n="action.export_csv">导出 CSV</button>
                </div>
                <div class="se-tool-group wrap" id="meas-balance-controls" hidden>
                  <select id="bal-domain-filter" class="se-select compact" aria-label="Domain">
                    <option value="all" data-i18n="meas.all">全部</option>
                    <option value="AC">AC</option>
                    <option value="DC">DC</option>
                  </select>
                  <button type="button" class="se-chip-btn warn" id="btn-bal-only-imb" data-i18n="bal.only_imb">仅不平衡</button>
                  <input id="bal-search-input" class="se-input compact" type="search" data-i18n-placeholder="ph.search_bus" placeholder="搜索母线">
                  <span class="se-muted tabular" id="bal-summary-meta">—</span>
                </div>
              </div>
              <div class="se-tool-group">
                <div class="se-batch-bar" id="meas-batch-bar" hidden>
                  <span class="tabular" id="meas-batch-cnt">0</span>
                  <button type="button" class="se-btn mini danger-ghost" id="btn-batch-suppress" data-i18n="batch.suppress">批量屏蔽</button>
                  <button type="button" class="se-btn mini" id="btn-batch-prefilter" data-i18n="batch.prefilter">批量预过滤</button>
                  <button type="button" class="se-btn mini" id="btn-batch-clear" data-i18n="batch.clear">清空</button>
                </div>
                <button type="button" class="se-btn mini" id="btn-export-meas" data-i18n="action.export_csv">导出 CSV</button>
              </div>
            </div>
            <div class="se-table-scroll" id="meas-table-wrap"></div>
            <div class="se-pager" id="meas-pager"></div>
            <div class="se-table-scroll" id="dev-table-wrap" hidden></div>
            <div class="se-table-scroll" id="bal-table-wrap" hidden></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- 页内就地处置模态框（屏蔽 / 预过滤 / 伪量测 / 权重） -->
  <dialog id="quick-action-dialog" class="se-modal wide" aria-labelledby="qa-title">
    <h3 id="qa-title">—</h3>
    <form id="qa-form" class="se-form-grid" style="margin-top:8px">
      <input type="hidden" name="mode" id="qa-mode">
      <input type="hidden" name="device_type" id="qa-dev-type">
      <input type="hidden" name="device_idx" id="qa-dev-idx">
      <input type="hidden" name="device_name" id="qa-dev-name">
      <input type="hidden" name="metric" id="qa-metric">
      <input type="hidden" name="unit" id="qa-unit">
      <div class="se-field full">
        <span data-i18n="qa.target">目标量测</span>
        <input id="qa-target-display" class="tabular" type="text" readonly>
      </div>
      <label class="se-field" id="qa-f-min" hidden>
        <span data-i18n="qa.min_val">下限 min</span>
        <input id="qa-min" class="tabular" type="number" step="any">
      </label>
      <label class="se-field" id="qa-f-max" hidden>
        <span data-i18n="qa.max_val">上限 max</span>
        <input id="qa-max" class="tabular" type="number" step="any">
      </label>
      <label class="se-field" id="qa-f-val" hidden>
        <span data-i18n="qa.pseudo_val">伪量测值</span>
        <input id="qa-val" class="tabular" type="number" step="any">
      </label>
      <label class="se-field" id="qa-f-weight" hidden>
        <span data-i18n="qa.weight">权重</span>
        <input id="qa-weight" class="tabular" type="number" step="any" min="1e-9" max="1e9">
      </label>
      <label class="se-field full">
        <span data-i18n="qa.note">备注 / 原因</span>
        <input id="qa-note" type="text" maxlength="200">
      </label>
      <div class="se-modal-actions full">
        <button type="button" class="se-btn ghost" id="btn-qa-cancel" data-i18n="action.cancel">取消</button>
        <button type="submit" class="se-btn primary" id="btn-qa-save" data-i18n="qa.submit">保存并生效</button>
      </div>
    </form>
  </dialog>

  <script src="/assets/se-dashboard.js"></script>
</body>
</html>
