<!doctype html>
<html lang="zh-CN" data-theme="minimalist-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>状态估计主画面 · PAS</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/se-dashboard.css">
  <link rel="icon" href="data:,">
  <script src="/assets/theme-registry.js"></script>
  <script src="/assets/pas-kit.js"></script>
</head>
<body data-page="/se-main" data-wall-ready="1" class="se-main-body">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">P</span>
        <div>
          <strong>PAS</strong>
          <small data-i18n="brand.sub">在线分析平台</small>
        </div>
      </div>
      <nav>
        <a href="/overview.html" data-route="overview" data-i18n="nav.overview">总览</a>
        <div class="nav-group">
          <span data-i18n="nav.analysis">分析功能</span>
          <a href="/se-main.html" data-route="se-root" class="nav-parent-active" data-i18n="nav.se_root">状态估计 SE</a>
          <div class="nav-sub">
            <a href="/se-main.html" data-route="se-main" class="active" data-i18n="nav.se_main">主画面</a>
            <a href="/se-flow.html" data-route="se-flow" data-i18n="nav.se_flow">潮流图</a>
            <a href="/se-curves.html" data-route="se-curves" data-i18n="nav.se_curves">历史曲线</a>
            <a href="/se-measurements.html" data-route="se-measurements" data-i18n="nav.se_measurements">全量测分析</a>
            <a href="/se-params.html" data-route="se-params" data-i18n="nav.se_params">算法参数</a>
            <a href="/se-prefilter.html" data-route="se-prefilter" data-i18n="nav.se_prefilter">预过滤量测</a>
            <a href="/se-pseudo.html" data-route="se-pseudo" data-i18n="nav.se_pseudo">伪量测</a>
            <a href="/se-bad.html" data-route="se-bad" data-i18n="nav.se_bad">坏量测</a>
            <a href="/se-logs.html" data-route="se-logs" data-i18n="nav.se_logs">运行日志</a>
          </div>
          <a href="/lf-main.html" data-route="lf" data-i18n="nav.lf">潮流分析 LF</a>
          <a href="/ca-main.html" data-route="ca" data-i18n="nav.ca">静态安全 CA</a>
        </div>
        <div class="nav-group">
          <span data-i18n="nav.management">运行管理</span>
          <a href="/runs.html" data-route="runs" data-i18n="nav.runs">运行历史</a>
          <a href="/settings.html" data-route="settings" data-i18n="nav.settings">系统设置</a>
        </div>
      </nav>
      <div class="sidebar-foot">
        <span class="status-dot" id="service-dot"></span>
        <span id="service-state" data-i18n="service.checking">服务检查中</span>
      </div>
    </aside>

    <main class="main se-main">
      <header class="se-topbar">
        <div class="se-title-group">
          <div class="se-title-row">
            <h1 data-i18n="title.home">状态估计主画面</h1>
            <span id="home-conv-pill" class="se-pill neutral">—</span>
            <span id="home-run-meta" class="se-run-meta tabular">—</span>
          </div>
        </div>
        <div class="se-top-actions">
          <button type="button" class="se-btn primary" id="btn-home-start" data-i18n="btn.start_calc">启动计算</button>
          <button type="button" class="se-chip-btn" id="btn-home-toggle-daemon" data-i18n="btn.pause_calc">暂停周期</button>
          <button type="button" class="se-chip-btn active" id="btn-auto-refresh" data-i18n="action.auto_on">自动刷新</button>
          <button type="button" class="se-btn ghost" id="btn-refresh" data-i18n="action.refresh">刷新</button>
          <select id="theme-select" class="se-select compact" aria-label="Theme">
            <option value="minimalist-light" data-i18n="theme.light">极简明亮</option>
            <option value="precision-dark" data-i18n="theme.dark">精密暗黑</option>
            <option value="bento-grid" data-i18n="theme.bento">便当盒网格</option>
            <option value="glassmorphism" data-i18n="theme.glass">毛玻璃拟态</option>
            <option value="editorial" data-i18n="theme.editorial">编辑杂志</option>
            <option value="sci-fi-cyan" data-i18n="theme.cyan">科幻 · 电光青</option>
            <option value="sci-fi-purple" data-i18n="theme.purple">科幻 · 赛博紫</option>
            <option value="sci-fi-matrix" data-i18n="theme.matrix">科幻 · 矩阵绿</option>
          </select>
          <select id="lang-select" class="se-select compact" aria-label="Language">
            <option value="zh-CN">中文</option>
            <option value="en-US">English</option>
            <option value="ru-RU">Русский</option>
          </select>
        </div>
      </header>

      <div id="notice" class="notice" role="status" hidden></div>

      <div class="se-workspace">
        <div class="pas-screen-shell">
          <!-- 顶部大屏态势英雄指标带 -->
          <section class="pas-hero-strip" id="se-hero-strip" aria-label="SE Key Metrics"></section>

          <!-- 核心三栏态势画布（支持拖拽分隔符与大屏自适应） -->
          <div class="se-home-grid" id="se-home-grid">
            <!-- 左栏：量测清洗流水线 + 健康构成 + 交直流建模规模 -->
            <div class="se-home-col">
              <section class="se-home-panel accent-meas grow">
                <div class="se-home-panel-head">
                  <h2 data-i18n="sec.meas_flow">量测清洗与构成</h2>
                  <a class="se-more-link" style="margin:0" href="/se-measurements.html?sub=balance" data-i18n="link.more">更多…</a>
                </div>
                <div class="se-home-panel-body">
                  <div class="pas-sub-hd">
                    <span data-i18n="sub.pipeline">量测清洗流水线</span>
                    <span class="se-muted tabular" id="se-pipe-meta">—</span>
                  </div>
                  <div id="se-meas-pipeline"></div>
                  <div class="se-kv-divider"></div>
                  <div class="pas-sub-hd">
                    <span data-i18n="sub.donut">量测健康构成</span>
                    <div class="se-sub-links" style="margin:0;padding:0;gap:8px">
                      <a class="se-more-link" style="margin:0;padding:0" href="/se-prefilter.html" data-i18n="link.prefilter">预过滤</a>
                      <a class="se-more-link" style="margin:0;padding:0" href="/se-pseudo.html" data-i18n="link.pseudo">伪量测</a>
                      <a class="se-more-link" style="margin:0;padding:0" href="/se-bad.html" data-i18n="link.bad">坏量测</a>
                    </div>
                  </div>
                  <div id="se-home-meas-donut"></div>
                  <div class="se-kv-divider"></div>
                  <div class="pas-sub-hd">
                    <span data-i18n="sub.topology">交直流拓扑规模</span>
                    <a class="se-more-link" style="margin:0;padding:0" href="/se-flow.html" data-i18n="btn.open_flow">潮流图 →</a>
                  </div>
                  <div class="pas-chip-grid" id="se-topo-chips"></div>
                </div>
              </section>
            </div>

            <div class="se-splitter is-v" id="split-col1" role="separator" aria-orientation="vertical" data-i18n-title="ui.split_v" title="拖动调整宽度 / 双击复位"></div>

            <!-- 中栏：五维质量雷达 + 分类量测健康 + 核心运行配置 -->
            <div class="se-home-col">
              <section class="se-home-panel accent-ctrl grow">
                <div class="se-home-panel-head">
                  <h2 data-i18n="sec.health_radar">估计质量画像</h2>
                  <a class="se-more-link" style="margin:0" href="/se-params.html" data-i18n="link.params">参数…</a>
                </div>
                <div class="se-home-panel-body">
                  <div class="pas-sub-hd">
                    <span data-i18n="sub.radar">SE 五维健康雷达</span>
                    <span class="se-pill ok tabular" id="se-obs-badge">—</span>
                  </div>
                  <div id="se-health-radar"></div>
                  <div class="se-kv-divider"></div>
                  <div class="pas-sub-hd">
                    <span data-i18n="sub.by_type">分类型量测合格率</span>
                    <span class="se-muted tabular" id="se-type-meta">—</span>
                  </div>
                  <div id="se-type-bars"></div>
                  <div class="se-kv-divider"></div>
                  <div class="pas-sub-hd">
                    <span data-i18n="sub.run_cfg">当前基态与调度</span>
                    <span class="se-muted tabular" id="h-model-scene">—</span>
                  </div>
                  <div class="pas-chip-grid cols-3" id="se-cfg-chips"></div>
                </div>
              </section>
            </div>

            <div class="se-splitter is-v" id="split-col2" role="separator" aria-orientation="vertical" data-i18n-title="ui.split_v" title="拖动调整宽度 / 双击复位"></div>

            <!-- 右栏：24h 趋势双曲线 + 下方最大残差 Top & 求解质量统计 -->
            <div class="se-home-right" id="se-home-right">
              <section class="se-home-panel accent-stat">
                <div class="se-home-rate-bar">
                  <div class="se-home-rate-items">
                    <div class="se-home-rate-item"><span data-i18n="r.cur_pass">当前合格率</span><strong class="tabular ok" id="h-r-cur">—</strong></div>
                    <div class="se-home-rate-item"><span data-i18n="r.today_avg">今日平均</span><strong class="tabular" id="h-r-today">—</strong></div>
                    <div class="se-home-rate-item"><span data-i18n="r.yest_avg">对比日平均</span><strong class="tabular" id="h-r-yest">—</strong></div>
                    <div class="se-home-rate-item"><span data-i18n="r.conv_rate">当日收敛率</span><strong class="tabular" id="h-r-conv">—</strong></div>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px">
                    <div class="se-tool-group" id="se-chart-mode">
                      <button type="button" class="se-chip-btn seg active" data-mode="pass" data-i18n="chart.mode_pass">合格率对比</button>
                      <button type="button" class="se-chip-btn seg" data-mode="bad" data-i18n="chart.mode_bad">坏数据趋势</button>
                    </div>
                    <a class="se-more-link" style="margin:0" href="/se-curves.html" data-i18n="link.more">更多…</a>
                  </div>
                </div>
                <div class="se-home-chart-wrap">
                  <div class="se-home-chart-host" id="home-pass-chart"></div>
                  <div class="se-home-chart-legend" id="home-pass-legend"></div>
                </div>
              </section>

              <div class="se-splitter is-h" id="split-right-h" role="separator" aria-orientation="horizontal" data-i18n-title="ui.split_h" title="拖动调整高度 / 双击复位"></div>

              <div class="se-home-bottom-cards" id="se-home-bottom">
                <section class="se-home-panel accent-stat">
                  <div class="se-home-panel-head">
                    <h2 data-i18n="sec.top_residuals">最大残差 Top 测点</h2>
                    <a class="se-more-link" style="margin:0" href="/se-measurements.html" data-i18n="link.more">更多…</a>
                  </div>
                  <div class="se-home-panel-body" id="se-top-residuals"></div>
                </section>

                <div class="se-splitter is-v" id="split-bottom-v" role="separator" aria-orientation="vertical" data-i18n-title="ui.split_v" title="拖动调整比例 / 双击复位"></div>

                <section class="se-home-panel accent-stat">
                  <div class="se-home-panel-head">
                    <h2 data-i18n="sec.solve_metrics">求解结果与运行指标</h2>
                    <a class="se-more-link" style="margin:0" href="/se-logs.html" data-i18n="link.more">更多…</a>
                  </div>
                  <div class="se-home-panel-body">
                    <div id="se-home-rate-bars"></div>
                    <div class="se-kv-divider"></div>
                    <div class="pas-chip-grid" id="se-solve-chips"></div>
                  </div>
                </section>
              </div>
            </div>
          </div>

          <!-- 底部通栏：运行信息 -->
          <a class="se-home-footer" href="/se-logs.html" id="home-log-bar">
            <span class="tag" data-i18n="foot.run_info">运行信息</span>
            <span class="se-muted tabular" id="h-log-time">—</span>
            <span class="msg" id="h-log-msg">—</span>
          </a>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/se-common.js"></script>
  <script src="/assets/se-home.js"></script>
</body>
</html>
